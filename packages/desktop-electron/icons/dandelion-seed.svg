<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="rect-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
    
    <filter id="slab-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" result="shadow1"/>
      <feDropShadow in="SourceAlpha" dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.25" result="shadow2"/>
      <feMerge>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="circle-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64C87A"/>
      <stop offset="100%" stop-color="#3A924C"/>
    </linearGradient>
    <linearGradient id="circle-side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#358545"/>
      <stop offset="100%" stop-color="#1A5225"/>
    </linearGradient>

    <filter id="circle-shadow" x="-20%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.2" result="shadow1"/>
      <feDropShadow in="SourceAlpha" dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.3" result="shadow2"/>
      <feMerge>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="seed-body-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#153818" flood-opacity="0.55"/>
    </filter>

    <filter id="fluff-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#153818" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#slab-shadow)">
    <rect x="112" y="112" width="824" height="824" rx="185" ry="185" fill="url(#rect-edge)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>

  <!-- Centered properly based on the new thick edge offset -->
  <g filter="url(#circle-shadow)">
    <circle cx="520" cy="508" r="320" fill="url(#circle-side)"/>
    <circle cx="504" cy="492" r="320" fill="url(#circle-face)"/>
  </g>

  <g transform="translate(530, 484) scale(4.8) translate(-124.5, -125)">
    <g filter="url(#fluff-shadow)" stroke="#FFFFFF" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round">
