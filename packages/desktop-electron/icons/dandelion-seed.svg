      <path d="m132.3 84.75c-6.56 14.19-11.96 24.42-15.02 28.34l1.1 1.02c7.67-6.2 15.5-15.43 25.06-23.9 1.42-1.33 2.57 0.48 1.3 2.21-7.32 10.57-14.13 16.7-19.54 19.48l0.49 1.38c9.18-2.2 18.04-8.37 27.02-15.67 1.67-1.33 2.73 1.3 1.69 2.32-9.36 9.29-18.22 14.11-26.3 15.99l0.24 1.45c9.8-0.18 19.6-3.66 31.34-10.36 1.85-1 2.66 1.81 1.15 2.73-11.65 8.01-22.36 9.27-31.72 8.87 9.18 2.68 18.78 2.07 30.81-0.41 2.11-0.51 2.71 2.61 0.6 3.05-15.89 4.46-31.09 3.64-43.29-3.17l-0.33-1.04 14.07-31.93c0.77-1.61 1.86-1.39 1.33-0.36z" fill="#FFFFFF" opacity="1"/>
      <path d="m116.4 116.7-16.31 35.72 2.34 0.87 16.31-34.71-2.34-1.88z" fill="#FFFFFF" opacity="1"/>
    </g>

    <g filter="url(#seed-body-shadow)">
      <g transform="translate(2.5, 2.5)" stroke="#1A4A22" stroke-width="2" stroke-linejoin="round">
        <path d="m94.8 154.7c-4.89 5.09-7.63 16.98-5.89 19.68 2.34 2.29 12.9-10.66 12.9-18.1-0.34-4.33-3.38-5.1-7.01-1.58z" fill="#1A4A22"/>
      </g>
      <g stroke="#E8D1B3" stroke-width="1.5" stroke-linejoin="round">
        <path d="m94.8 154.7c-4.89 5.09-7.63 16.98-5.89 19.68 2.34 2.29 12.9-10.66 12.9-18.1-0.34-4.33-3.38-5.1-7.01-1.58z" fill="#F5E4CA"/>
        <path d="m100.1 151.7-11.25 22.04c1.51 1.98 12.62-10.7 12.92-17.63-0.12-1.99-0.62-3.87-1.67-4.41z" fill="#3D2A15" opacity=".25" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
